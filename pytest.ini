[pytest]
log_format = %(asctime)s %(name)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
# Live logs for every test, not only the failed ones: a test that hangs rather
# than fails prints nothing otherwise, as captured logs are shown once a test
# has ended.
log_cli = True
# log_cli_level = DEBUG
