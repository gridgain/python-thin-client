[pytest]
log_format = %(asctime)s %(name)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
# Without this a test that hangs prints nothing.
log_cli = True
# Async fixtures are plain @pytest.fixture, which only auto mode picks up.
asyncio_mode = auto
# One loop for the whole run, shared by tests and async fixtures, which is what the
# old session-scoped event_loop fixture did.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
