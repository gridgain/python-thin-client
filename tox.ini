[tox]
skipsdist = True
envlist = codestyle,py{39,310,311,312,313}

[flake8]
max-line-length=120
# Use extend-ignore, not ignore: 'ignore' would replace the default list and
# turn W503 on. This code breaks lines before the operator, as PEP 8 asks.
extend-ignore = F401,F403,F405,F821
exclude = .tox,.eggs,build,dist,distr,venv,*.egg-info

[testenv:codestyle]
basepython = python3.9
commands = flake8

[testenv]
passenv = TEAMCITY_VERSION IGNITE_HOME
envdir = {homedir}/.virtualenvs/pygridgain-{envname}
deps =
    -r ./requirements/install.txt
    -r ./requirements/tests.txt
recreate = True
usedevelop = True
commands =
    pytest {env:PYTESTARGS:} {posargs} --force-cext --examples

[testenv:py{39,310,311,312,313}-jenkins]
setenv:
    PYTESTARGS = --junitxml=junit-{envname}.xml
